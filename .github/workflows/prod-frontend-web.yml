name: PROD - Frontend Web (Docker Hub)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/gradpulse-frontend/web/**"
      - ".github/workflows/prod-frontend-web.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (PROD)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/gradpulse-frontend/web
          push: true
          tags: |
            rommela462/gradpulse-web:prod-latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
