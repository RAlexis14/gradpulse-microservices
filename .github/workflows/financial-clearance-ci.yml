name: financial-clearance-ci 💰

on:
  push:
    branches:
      - qa
    paths:
      - backend/services/finance/financial-clearance-service/**

  pull_request:
    branches:
      - qa
    paths:
      - backend/services/finance/financial-clearance-service/**

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: backend/services/finance/financial-clearance-service
        run: |
          poetry install --no-root

      - name: Run tests
        working-directory: backend/services/finance/financial-clearance-service
        run: |
          poetry run pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: backend/services/finance/financial-clearance-service
        run: |
          docker build -t rommela462/financial-clearance-service:qa-latest .


      - name: 🚀 Push Docker image
        run: |
          docker push rommela462/financial-clearance-service:qa-latest
